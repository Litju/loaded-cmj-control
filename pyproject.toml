[project]
name = "loaded-cmj-control"
version = "0.1.0"
description = "Deterministic MuJoCo simulation and hybrid feedback control for a loaded countermovement jump."
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.8.0",
    "numpy>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loaded_cmj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
